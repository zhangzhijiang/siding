<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SiDing - Four Tops</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8396981938969998" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script>
      // Apply saved theme before first paint to avoid a flash. Defaults to dark.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') { document.documentElement.classList.remove('dark'); }
          else { document.documentElement.classList.add('dark'); }
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 antialiased overflow-hidden selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
